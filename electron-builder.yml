# electron-builder config. macOS is the real target; Linux exists only so the
# app can be built and smoke-tested on h under xvfb.
appId: com.volcanex.g-command
productName: G-Command
copyright: Copyright Gabriel Penman
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES
  - "!**/*.map"
asar: true

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing is off until the Mac agent has a Developer ID certificate in the
  # login keychain. Set identity to the certificate name (or remove this line
  # and let electron-builder find it) to sign.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    LSUIElement: false
    NSUserNotificationAlertStyle: alert
  # Notarisation placeholder. electron-builder notarises after signing when
  # this is true and APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER (or
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID) are set in the
  # environment. Never put those values in this file.
  notarize: false

dmg:
  sign: false

linux:
  target: [dir]
  icon: build/icon.png
  category: Development
  executableName: g-command
